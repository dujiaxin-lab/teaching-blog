<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | escape }} — Fieldnotes</title>
    <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}">
    {% include analytics.html %}
  </head>
  <body>
    <header class="site-header">
      <a class="wordmark" href="{{ '/' | relative_url }}"><span class="wordmark-icon" aria-hidden="true">f.</span> fieldnotes</a>
      <nav aria-label="Main navigation">
        <a href="{{ '/#articles' | relative_url }}">Articles</a>
        <a href="{{ '/#about' | relative_url }}">About</a>
        <a class="nav-github" href="https://github.com/dujiaxin-lab/teaching-blog">View on GitHub <span aria-hidden="true">↗</span></a>
      </nav>
    </header>
    <main class="article-page">
      <a class="text-link" href="{{ '/#articles' | relative_url }}">← Back to the journal</a>
      <article class="article-content">
        {{ content }}
      </article>
    </main>
    <footer class="site-footer">
      <a class="wordmark" href="{{ '/' | relative_url }}"><span class="wordmark-icon" aria-hidden="true">f.</span> fieldnotes</a>
      <span>Ideas for curious minds.</span>
      <a href="https://github.com/dujiaxin-lab/teaching-blog">Open source on GitHub <span aria-hidden="true">↗</span></a>
    </footer>
  </body>
</html>
